name: K16 Pisa v7 local-median-order exact matrix

on:
  workflow_dispatch:
    inputs:
      seconds_per_box:
        description: Continuous solver budget for each complete LMO parent layer
        required: true
        default: "14400"
  push:
    branches:
      - "agent/k16-endpoint-endgame"
    paths:
      - "campaigns/v7-median-formal-trigger.txt"

permissions:
  contents: read

concurrency:
  group: k16-pisa-v7-median-formal
  cancel-in-progress: false

jobs:
  gates:
    name: Median-order positive gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run exact positive gates
        run: |
          mkdir -p results
          python scripts/median_order_v7.py \
            --gates-only --gate-seconds 60 --workers 4 \
            --output results/gates.json
      - uses: actions/upload-artifact@v7
        with:
          name: endgame-v7-median-formal-gates
          path: results/
          if-no-files-found: error
          retention-days: 90

  plan:
    name: Generate six complete LMO parent layers
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - id: matrix
        shell: bash
        run: |
          matrix="$(python scripts/median_order_v7.py --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          test "$(python scripts/median_order_v7.py --list-boxes | wc -l)" -eq 6

  boxes:
    name: Exact LMO ${{ matrix.box }}
    needs:
      - gates
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Solve one complete local-median parent layer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "results/${{ matrix.box }}"
          python scripts/median_order_v7.py \
            --box "${{ matrix.box }}" \
            --seconds "${{ inputs.seconds_per_box || '14400' }}" \
            --workers 4 \
            --seed 20260727 \
            --output "results/${{ matrix.box }}/result.json" \
            2>&1 | tee "results/${{ matrix.box }}/run.log"
      - name: Add logical status to job summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("results/${{ matrix.box }}/result.json")
          if not p.exists():
              print("## ERROR: result.json was not produced")
          else:
              r = json.loads(p.read_text())
              print(f"## {r['box']}: {r['status']}")
              print(f"- Feed zero type: `{tuple(r['feed_zero_type'])}`")
              print(f"- Total blockers: `{r['total_blockers']}`")
              print(f"- Runtime: `{r['seconds']}` seconds")
              print(f"- Conflicts / branches: `{r['conflicts']} / {r['branches']}`")
              if r["status"] == "SAT":
                  print("- **Independent verifier accepted a K16 witness.**")
              elif r["status"] == "UNSAT":
                  print("- This full exact parent layer is closed.")
              else:
                  print("- UNKNOWN: this parent layer remains open.")
          PY
      - name: Upload JSON and complete log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: endgame-v7-median-${{ matrix.box }}
          path: results/${{ matrix.box }}/
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Aggregate the six-layer LMO map
    if: ${{ always() && needs.boxes.result != 'skipped' }}
    needs: boxes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: endgame-v7-median-lmo_*
          path: downloaded
      - name: Build logical summary
        shell: bash
        run: |
          mkdir -p summary
          python scripts/aggregate_endgame.py downloaded \
            --label "v7 exact local-median-order parent layers" \
            --expected 6 \
            --output summary/endpoint-v7-median-summary.json \
            | tee summary/endpoint-v7-median-summary.md
          cat summary/endpoint-v7-median-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: endgame-v7-median-summary
          path: summary/
          if-no-files-found: error
          retention-days: 90
