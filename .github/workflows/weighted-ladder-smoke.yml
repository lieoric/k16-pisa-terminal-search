name: K16 weighted quotient ladder smoke

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per frontier pattern
        required: true
        default: "60"
  pull_request:
    paths:
      - "scripts/weighted_quotient_ladder.py"
      - "scripts/aggregate_weighted_ladder.py"
      - ".github/workflows/weighted-ladder-*.yml"
      - "requirements.txt"
      - "pisa_verify.py"

permissions:
  contents: read

concurrency:
  group: k16-weighted-ladder-smoke
  cancel-in-progress: true

jobs:
  gates:
    name: Identity and positive/negative gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run exact gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results logs
          python scripts/weighted_quotient_ladder.py \
            --gates --seconds 30 --workers 4 \
            --output results/gates.json 2>&1 | tee logs/gates.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weighted-ladder-smoke-gates
          path: |
            results/
            logs/
          retention-days: 30

  frontier:
    name: Smoke ${{ matrix.box }}
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        box: [h15_p00, h14_p00, h14_p01]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Solve frontier pattern briefly
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results logs
          python scripts/weighted_quotient_ladder.py \
            --box "${{ matrix.box }}" \
            --seconds "${{ inputs.seconds || '60' }}" \
            --workers 4 \
            --output results/result.json \
            2>&1 | tee "logs/${{ matrix.box }}.log"
      - name: Add result to job summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("results/result.json")
          if not path.exists():
              print("## ERROR\n\nNo result JSON was produced.")
          else:
              r = json.loads(path.read_text())
              print(f"## {r['box']}: {r['status']}")
              print(f"\n- weights: `{r['weight_multiset']}`")
              print(f"- wall seconds: `{r['wall_seconds']}`")
              print(f"- solver status: `{r['solver_status']}`")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weighted-ladder-smoke-${{ matrix.box }}
          path: |
            results/
            logs/
          retention-days: 30

