name: K16 Pisa v10 invariant refinement smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/k16-endpoint-endgame"
    paths:
      - "scripts/median_order_v10.py"
      - ".github/workflows/endgame-v10-invariant-smoke.yml"

permissions:
  contents: read

concurrency:
  group: k16-pisa-v10-invariant-smoke
  cancel-in-progress: true

jobs:
  gates:
    name: Positive and exact-coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run K12/K14 and 34-box coverage gates
        run: |
          mkdir -p results
          python scripts/median_order_v10.py \
            --gates-only --gate-seconds 60 --workers 4 \
            --output results/gates.json
      - uses: actions/upload-artifact@v7
        with:
          name: endgame-v10-invariant-smoke-gates
          path: results/
          if-no-files-found: error
          retention-days: 90

  plan:
    name: Validate the 34-box matrix
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - id: matrix
        shell: bash
        run: |
          matrix="$(python scripts/median_order_v10.py --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, subprocess
          matrix = json.loads(subprocess.check_output(
              ["python", "scripts/median_order_v10.py", "--matrix"],
              text=True,
          ))
          assert len(matrix["include"]) == 34
          assert len({row["box"] for row in matrix["include"]}) == 34
          PY

  boxes:
    name: Smoke ${{ matrix.box }}
    needs:
      - gates
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build and sample one invariant box
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "results/${{ matrix.box }}"
          python scripts/median_order_v10.py \
            --box "${{ matrix.box }}" \
            --seconds 5 \
            --workers 4 \
            --seed "$((20260727 + ${{ matrix.index }}))" \
            --output "results/${{ matrix.box }}/result.json" \
            2>&1 | tee "results/${{ matrix.box }}/run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: endgame-v10-smoke-${{ matrix.box }}
          path: results/${{ matrix.box }}/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Aggregate v10 smoke
    if: ${{ always() && needs.boxes.result != 'skipped' }}
    needs: boxes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: endgame-v10-smoke-inv_*
          path: downloaded
      - name: Build logical summary
        shell: bash
        run: |
          mkdir -p summary
          python scripts/aggregate_endgame.py downloaded \
            --label "v10 invariant-refinement smoke" \
            --expected 34 \
            --output summary/v10-invariant-smoke-summary.json \
            | tee summary/v10-invariant-smoke-summary.md
          cat summary/v10-invariant-smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: endgame-v10-invariant-smoke-summary
          path: summary/
          if-no-files-found: error
          retention-days: 90
