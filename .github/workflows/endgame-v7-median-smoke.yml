name: K16 Pisa v7.1 unknown-only local-median smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/k16-endpoint-endgame"
    paths:
      - "k16_pisa_solver.py"
      - "scripts/median_order_v7.py"
      - ".github/workflows/endgame-v7-median-smoke.yml"

permissions:
  contents: read

concurrency:
  group: k16-pisa-v7-1-median-smoke
  cancel-in-progress: true

jobs:
  gates:
    name: Median-order positive gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run K12 and K14 exact median-order gates
        run: |
          mkdir -p results
          python scripts/median_order_v7.py \
            --gates-only --gate-seconds 30 --workers 4 \
            --output results/gates.json
      - uses: actions/upload-artifact@v7
        with:
          name: endgame-v7-1-median-smoke-gates
          path: results/
          if-no-files-found: error
          retention-days: 90

  boxes:
    name: Smoke ${{ matrix.box }} cube ${{ matrix.cube }}
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        box: [lmo_d7_b1_B16, lmo_d7_b1_B17, lmo_d7_b1_B18, lmo_d7_b1_B19, lmo_d7_b1_B20plus, lmo_d6_b3_B20plus]
        cube: [0, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build and search for ten seconds
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "results/${{ matrix.box }}/cube-${{ matrix.cube }}"
          python scripts/median_order_v7.py \
            --box "${{ matrix.box }}" \
            --cube "${{ matrix.cube }}" \
            --seconds 10 --workers 4 \
            --seed "$((20260727 + ${{ matrix.cube }}))" \
            --output "results/${{ matrix.box }}/cube-${{ matrix.cube }}/result.json" \
            2>&1 | tee "results/${{ matrix.box }}/cube-${{ matrix.cube }}/run.log"
      - name: Add logical result to summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("results/${{ matrix.box }}/cube-${{ matrix.cube }}/result.json")
          if not p.exists():
              print("## ERROR: result.json was not produced")
          else:
              r = json.loads(p.read_text())
              print(f"## {r['box']} cube {r['cube']}: {r['status']}")
              print(f"- Feed zero type: `{tuple(r['feed_zero_type'])}`")
              print(f"- Total blockers: `{r['total_blockers']}`")
              print(f"- Branches: `{r['branches']}`")
              if r["status"] == "SAT":
                  print("- **Independent verifier accepted a K16 witness.**")
              elif r["status"] == "UNSAT":
                  print("- This complete local-median parent layer is closed.")
              else:
                  print("- UNKNOWN is expected in a ten-second smoke run.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: endgame-v7-1-median-smoke-${{ matrix.box }}-cube-${{ matrix.cube }}
          path: results/${{ matrix.box }}/cube-${{ matrix.cube }}/
          if-no-files-found: warn
          retention-days: 90
