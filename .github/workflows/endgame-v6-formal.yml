name: K16 Pisa v6 exact remaining endpoint matrix

on:
  workflow_dispatch:
    inputs:
      d7_seconds:
        description: Continuous solver budget for each d7/b1 box
        required: true
        default: "3600"
      d6_seconds:
        description: Continuous solver budget for each orbit-split d6/b3 box
        required: true
        default: "1800"
  push:
    branches:
      - "agent/k16-endpoint-endgame"
    paths:
      - ".github/workflows/endgame-v6-formal.yml"

permissions:
  contents: read

concurrency:
  group: k16-pisa-v6-formal
  cancel-in-progress: false

jobs:
  gates:
    name: Rooted-role positive gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run exact positive gates
        run: |
          mkdir -p results
          python scripts/endpoint_v6.py \
            --gates-only --gate-seconds 60 --workers 4 \
            --output results/gates.json
      - uses: actions/upload-artifact@v7
        with:
          name: endgame-v6-formal-gates
          path: results/
          if-no-files-found: error
          retention-days: 90

  plan:
    name: Generate the 54-box exact matrix
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - id: matrix
        shell: bash
        run: |
          matrix="$(python scripts/endpoint_v6.py --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          test "$(python scripts/endpoint_v6.py --list-boxes | wc -l)" -eq 54

  boxes:
    name: Exact v6 ${{ matrix.box }}
    needs:
      - gates
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned solver
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Solve one exact disjoint box
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "results/${{ matrix.box }}"
          if [[ "${{ matrix.box }}" == d7_* ]]; then
            seconds="${{ inputs.d7_seconds || '3600' }}"
          else
            seconds="${{ inputs.d6_seconds || '1800' }}"
          fi
          python scripts/endpoint_v6.py \
            --box "${{ matrix.box }}" \
            --seconds "$seconds" \
            --workers 4 \
            --seed 20260726 \
            --output "results/${{ matrix.box }}/result.json" \
            2>&1 | tee "results/${{ matrix.box }}/run.log"
      - name: Add logical status to job summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("results/${{ matrix.box }}/result.json")
          if not p.exists():
              print("## ERROR: result.json was not produced")
          else:
              r = json.loads(p.read_text())
              print(f"## {r['box']}: {r['status']}")
              print(f"- Parent v5 box: `{r['parent_v5_box']}`")
              print(f"- Zero type: `{tuple(r['zero_type'])}`")
              print(f"- Total blockers: `{r['total_blockers']}`")
              print(f"- Anchor degree: `{r['anchor_degree']}`")
              print(f"- Anchor pattern: `{r['anchor_pattern']}`")
              if r["status"] == "SAT":
                  print("- **Independent verifier accepted a K16 witness.**")
              elif r["status"] == "UNSAT":
                  print("- This exact named subbox is closed.")
              else:
                  print("- UNKNOWN: this subbox remains open.")
          PY
      - name: Upload JSON and complete log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: endgame-v6-${{ matrix.box }}
          path: results/${{ matrix.box }}/
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Aggregate the exact 54-box map
    if: ${{ always() && needs.boxes.result != 'skipped' }}
    needs: boxes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: endgame-v6-*
          path: downloaded
      - name: Build logical summary
        shell: bash
        run: |
          mkdir -p summary
          python scripts/aggregate_endgame.py downloaded \
            --label "v6 exact refinement of all 43 open v5 endpoints" \
            --expected 54 \
            --output summary/endpoint-v6-summary.json \
            | tee summary/endpoint-v6-summary.md
          cat summary/endpoint-v6-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: endgame-v6-summary
          path: summary/
          if-no-files-found: error
          retention-days: 90
